server:
  # Bind to loopback only: the inspector can dump heaps of production processes.
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: jvm-leak-inspector
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Allow uploading existing .hprof files for offline analysis.
      max-file-size: -1
      max-request-size: -1

# Defaults shown; see InspectorProperties for every option.
inspector:
  live:
    sample-interval: 1s          # MemoryMXBean / pools / GC polling
    histogram-interval: 10s      # GC.class_histogram -all for the leak radar (no Full GC, safepoint heap walk)
    histogram-max-interval: 2m   # the interval doubles while histograms exceed the pause budget
    histogram-pause-budget: 500ms
    leak-candidate-threshold: 60
  jmx:
    connect-timeout: 15s
    reconnect-max-backoff: 30s
  jfr:
    poll-interval: 10s           # each poll rotates the target's JFR chunk
    max-age: 3m
    max-size: 64MB
  snapshots:
    # The TARGET writes the dump here: use a path it sees too (not under systemd PrivateTmp).
    # work-dir: /var/lib/jvm-leak-inspector
    disk-space-factor: 2.5       # free space required = factor x target used heap (never below 2.5)
    dump-timeout: 30m
    top-dominators: 200
    max-snapshots: 20

logging:
  level:
    com.poludnitsa.inspector: INFO
